<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>音の実験（使い捨て）</title>
<style>
  /* 使い捨ての実験ページ。アプリ本体とは別 */
  :root { --bg:#fff; --ink:#222; --muted:#666; --accent:#5b6cf0; --card:#f3f3f7; }
  @media (prefers-color-scheme: dark) { :root { --bg:#16171c; --ink:#eee; --muted:#aaa; --card:#24262e; } }
  body { margin:0; padding:16px; background:var(--bg); color:var(--ink); font-family:system-ui,sans-serif; line-height:1.6; }
  h1 { font-size:1.3rem; }
  .card { background:var(--card); border-radius:12px; padding:12px; margin:12px 0; }
  button { font-size:1rem; padding:10px 14px; border-radius:10px; border:0; background:var(--accent); color:#fff; width:100%; }
  button:disabled { opacity:.5; }
  .muted { color:var(--muted); font-size:.9rem; }
  .bar { height:12px; background:#ddd; border-radius:6px; overflow:hidden; margin-top:6px; }
  .bar > div { height:100%; width:0; background:var(--accent); }
  #log { white-space:pre-wrap; font-size:.8rem; color:var(--muted); }
</style>
</head>
<body>
<h1>音の実験（使い捨て）</h1>
<p>イヤホンを<strong>外して</strong>、iPhone の音量を<strong>少し下げてから</strong>試してください。</p>
<p class="muted">それぞれのボタンを押すと：マイクを使う → お手本の音が1.5秒鳴る → 「どうぞ」のあと3秒、声を出してください（「あー」）。</p>
<div id="tests"></div>
<div class="card"><div class="muted">記録（結果を伝えるときの参考）</div><div id="log"></div></div>

<script>
// 何を確かめるか：マイクを使っている間、お手本の音が小さくなるのをどう防げるか
const TESTS = [
  { id: 1, name: 'いまと同じやり方', run: modeDefault },
  { id: 2, name: '候補A：鳴らす間だけ「再生だけ」に切りかえる', run: modeSwitch },
  { id: 3, name: '候補B：鳴らす間はマイクを閉じ、あとで開き直す', run: modeReopen },
  { id: 4, name: '候補C：「マイクと再生」を先に指定する', run: modeExplicit },
  { id: 5, name: '候補D：いまのやり方で、音だけ3倍', run: modeLoud },
  { id: 6, name: '候補E：別の鳴らし方（audio 要素）で鳴らす', run: modeElement },
];

let ctx = null;
let stream = null;
const log = (t) => { document.getElementById('log').textContent += t + '\n'; };
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const sessionType = () => (navigator.audioSession ? navigator.audioSession.type : '（なし）');
function setType(t) { try { if (navigator.audioSession) navigator.audioSession.type = t; } catch (e) { log('type 変更できず: ' + e.message); } }

function audioCtx() {
  if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
  if (ctx.state !== 'running') ctx.resume().catch(() => {});
  return ctx;
}
async function openMic() {
  stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
}
function closeMic() { if (stream) stream.getTracks().forEach((t) => t.stop()); stream = null; }
function resetAll() { closeMic(); setType('auto'); }

// Web Audio で 440Hz の音を鳴らす
async function beep(gain = 0.3) {
  const c = audioCtx();
  const osc = c.createOscillator(); const g = c.createGain();
  osc.type = 'triangle'; osc.frequency.value = 440;
  const t = c.currentTime;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(gain, t + 0.03);
  g.gain.setValueAtTime(gain, t + 1.42); g.gain.linearRampToValueAtTime(0, t + 1.5);
  osc.connect(g); g.connect(c.destination); osc.start(t); osc.stop(t + 1.5);
  await wait(1600);
}
// audio 要素で同じ音を鳴らす（WAV をその場で作る）
async function beepElement() {
  const sr = 44100, n = sr * 1.5, buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
  const w = (o, s) => [...s].forEach((ch, i) => v.setUint8(o + i, ch.charCodeAt(0)));
  w(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); w(8, 'WAVE'); w(12, 'fmt ');
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, sr, true); v.setUint32(28, sr * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  w(36, 'data'); v.setUint32(40, n * 2, true);
  for (let i = 0; i < n; i++) {
    const env = Math.min(1, i / 1300, (n - i) / 3500);
    const tri = 2 * Math.abs(2 * ((i * 440 / sr) % 1) - 1) - 1;
    v.setInt16(44 + i * 2, tri * env * 0.3 * 32767, true);
  }
  const url = URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
  const a = new Audio(url); await a.play().catch((e) => log('audio 要素で鳴らせず: ' + e.message));
  await wait(1600); URL.revokeObjectURL(url);
}
// 3秒間、マイクの音の大きさを見る。いちばん大きい値を返す
async function listen(card) {
  const bar = card.querySelector('.bar > div');
  const status = card.querySelector('.status');
  if (!stream || stream.getAudioTracks().every((t) => t.readyState !== 'live')) { status.textContent = 'マイク：止まっています ×'; return 0; }
  const c = audioCtx(); const src = c.createMediaStreamSource(stream); const an = c.createAnalyser();
  an.fftSize = 2048; src.connect(an); const data = new Float32Array(an.fftSize);
  status.textContent = 'どうぞ（「あー」と3秒）';
  let peak = 0; const end = performance.now() + 3000;
  while (performance.now() < end) {
    an.getFloatTimeDomainData(data);
    let s = 0; for (const x of data) s += x * x; const rms = Math.sqrt(s / data.length);
    peak = Math.max(peak, rms); bar.style.width = Math.min(100, rms * 400) + '%';
    await wait(50);
  }
  src.disconnect();
  status.textContent = peak > 0.01 ? 'マイク：声が届きました ○' : 'マイク：声が届きません ×';
  return peak;
}

async function modeDefault(card) { await openMic(); await beep(); return listen(card); }
async function modeSwitch(card) { await openMic(); setType('playback'); await beep(); setType('play-and-record'); return listen(card); }
async function modeReopen(card) { closeMic(); setType('playback'); await beep(); setType('auto'); await openMic(); return listen(card); }
async function modeExplicit(card) { setType('play-and-record'); await openMic(); await beep(); return listen(card); }
async function modeLoud(card) { await openMic(); await beep(0.9); return listen(card); }
async function modeElement(card) { await openMic(); await beepElement(); return listen(card); }

function makeCard(test) {
  const card = document.createElement('div'); card.className = 'card';
  card.innerHTML = `<div><strong>[${test.id}] ${test.name}</strong></div>
    <button>鳴らす</button><div class="status muted">　</div><div class="bar"><div></div></div>`;
  const btn = card.querySelector('button');
  btn.onclick = async () => {
    document.querySelectorAll('#tests button').forEach((b) => (b.disabled = true));
    resetAll(); await wait(300);
    try {
      const before = sessionType();
      const peak = await test.run(card);
      log(`[${test.id}] type前=${before} 後=${sessionType()} ctx=${ctx && ctx.state} マイク最大=${peak.toFixed(3)}`);
    } catch (e) { card.querySelector('.status').textContent = 'エラー: ' + e.message; log(`[${test.id}] エラー ${e.name}: ${e.message}`); }
    resetAll();
    document.querySelectorAll('#tests button').forEach((b) => (b.disabled = false));
  };
  return card;
}
TESTS.forEach((t) => document.getElementById('tests').append(makeCard(t)));
log('audioSession: ' + (navigator.audioSession ? 'あり' : 'なし') + ' / ' + navigator.userAgent);
</script>
</body>
</html>
